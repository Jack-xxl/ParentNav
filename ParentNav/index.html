<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>父母罗盘™ · AI时代家庭觉醒系统</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0c0e16;--ink2:#141720;
  --gold:#c9a84c;--gold2:#e8c97a;
  --cream:#f0ead8;--muted:#8a8478;
  --border:rgba(201,168,76,.22);--bdim:rgba(255,255,255,.07);
  --wechat:#07c160;
}
html{scroll-behavior:smooth}
body{background:var(--ink);color:#ddd8cc;font-family:'Noto Serif SC',Georgia,serif;min-height:100vh;overflow-x:hidden}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes wPulse{0%,100%{box-shadow:0 0 0 0 rgba(7,193,96,.5)}60%{box-shadow:0 0 0 14px rgba(7,193,96,0)}}

#topbar{position:fixed;top:0;left:0;right:0;height:2px;z-index:50;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

#banner{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center}
#banner.show{display:flex;animation:fadeIn .4s ease}
.banner-icon{font-size:54px;margin-bottom:18px;animation:glow 2s ease infinite}
.banner-label{font-size:10px;letter-spacing:6px;color:rgba(255,255,255,.38);text-transform:uppercase;margin-bottom:12px}
.banner-title{font-size:clamp(36px,7vw,62px);font-weight:700;color:#fff;margin:0}

#app{position:relative;z-index:1}
.page{max-width:700px;margin:0 auto;padding:64px 24px 100px;animation:fadeUp .8s ease}
.page.result{max-width:800px}

.logo-row{display:flex;align-items:center;gap:12px;margin-bottom:52px}
.logo-box{width:32px;height:32px;border:1.5px solid var(--gold);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gold);flex-shrink:0}
.logo-top{font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase}
.logo-bot{font-size:10px;letter-spacing:3px;color:#504840;text-transform:uppercase;margin-top:2px}

.eyebrow{font-size:12px;letter-spacing:5px;color:var(--muted);text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(28px,5vw,46px);font-weight:700;color:var(--cream);line-height:1.3;margin-bottom:22px}
h1 span{color:var(--gold)}
.rule-row{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.rule{width:40px;height:2px;background:var(--gold)}
.rule-text{font-size:11px;color:#665f50;letter-spacing:2px}

.card{border:1px solid var(--border);border-radius:4px;padding:28px 26px;margin-bottom:28px;background:rgba(201,168,76,.04)}
.card p{font-size:14px;line-height:2.1;color:#b0a898;margin-bottom:14px}
.card p.light{color:#c8c0aa}
.card .divider{height:1px;background:var(--bdim);margin:16px 0}
.card .danger{font-size:16px;font-weight:600;color:#e07060;line-height:1.7}

.stats{display:flex;gap:44px;margin-bottom:48px;flex-wrap:wrap}
.stat-num{font-size:36px;font-weight:700;color:var(--gold);line-height:1}
.stat-lbl{font-size:11px;color:#665f50;letter-spacing:2px;margin-top:6px}

.btn{background:var(--gold);color:var(--ink);border:none;border-radius:3px;padding:15px 44px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:2px;transition:all .22s ease;display:inline-block;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(1px);opacity:.9}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--bdim);border-radius:3px;padding:10px 24px;font-size:12px;letter-spacing:1px;cursor:pointer;font-family:inherit;transition:all .2s;-webkit-tap-highlight-color:transparent}
.ghost:active{border-color:var(--border);color:var(--gold)}

/* QUIZ */
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-section{display:flex;align-items:center;gap:10px}
.progress-icon{font-size:15px}
.progress-label{font-size:10px;letter-spacing:4px;color:#605850;text-transform:uppercase}
.progress-count{font-size:13px;color:#403830}
.progress-bar{height:1px;background:rgba(255,255,255,.05);margin-bottom:38px}
.progress-fill{height:100%;transition:width .5s ease}

.q-num{font-size:10px;letter-spacing:5px;text-transform:uppercase;margin-bottom:16px}
.q-text{font-size:clamp(20px,3.5vw,28px);font-weight:600;line-height:1.65;color:var(--cream);margin-bottom:28px}

.opts{border-left:2px solid rgba(201,168,76,.28);padding-left:22px;margin-bottom:32px;display:flex;flex-direction:column;gap:14px}
.opt-row{display:flex;align-items:baseline;gap:14px}
.opt-label{font-size:12px;font-weight:700;color:var(--gold);min-width:16px;flex-shrink:0;letter-spacing:1px}
.opt-text{font-size:15px;color:#c0b8a8;line-height:1.8}

.items-box{background:var(--ink2);border:1px solid var(--bdim);border-radius:3px;padding:18px 22px;margin-bottom:20px}
.item-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.item-row:last-child{margin-bottom:0}
.dot{width:3px;height:3px;border-radius:50%;background:var(--gold);flex-shrink:0}
.item-text{font-size:14px;color:#b8b0a0;line-height:1.7}

.companies{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.company-box{background:var(--ink2);border:1px solid var(--bdim);border-radius:3px;padding:16px 18px}
.company-label{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.company-name{font-size:13px;color:#9a9280;margin-bottom:6px}

.recruit-box{border:1px solid rgba(201,168,76,.35);border-radius:4px;padding:20px 22px;margin-bottom:20px;background:rgba(201,168,76,.07)}
.recruit-tag{font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
.recruit-line{font-size:16px;font-weight:700;color:var(--gold2);line-height:2;margin:0}
.recruit-intro{font-size:13px;color:var(--muted);line-height:2;margin:0}

.note-box{border-left:2px solid rgba(201,168,76,.3);padding-left:18px;margin-bottom:32px}
.note-text{font-size:13px;color:var(--gold2);line-height:1.95;font-style:italic;margin-bottom:4px}

/* RESULT */
.section-tag{font-size:10px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:20px}
.result-title{font-size:clamp(20px,3.5vw,28px);font-weight:700;color:var(--cream);line-height:1.5;margin-bottom:20px}
.result-body{font-size:15px;line-height:2.1;color:#b0a898;margin-bottom:20px}
.result-divider{height:1px;background:var(--bdim);margin:20px 0}
.result-sub{font-size:14px;color:#c0b8a0;line-height:1.9;margin-bottom:14px}
.result-item{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.result-item-text{font-size:14px;color:var(--gold2)}
.result-italic{font-size:16px;color:var(--cream);line-height:1.9;font-style:italic}
.result-italic strong{color:var(--gold)}

.plain-card{background:var(--ink2);border:1px solid var(--bdim);border-radius:4px;padding:26px;margin-bottom:20px}
.plain-card p{font-size:15px;line-height:2.1}
.plain-card p.dim{color:#b0a898;margin-bottom:14px}
.plain-card p.bright{color:#c8c0a8}
.plain-card p.bright strong{color:var(--cream)}

.explore-card{border:1px solid var(--bdim);border-radius:4px;padding:26px;margin-bottom:20px;background:rgba(255,255,255,.015)}
.explore-label{font-size:10px;letter-spacing:5px;color:var(--muted);text-transform:uppercase;margin-bottom:18px}
.explore-item{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.explore-item:last-child{margin-bottom:0}
.explore-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);flex-shrink:0}
.explore-text{font-size:15px;color:#c8c0a8;line-height:1.6}

.wechat-card{background:rgba(7,193,96,.06);border:1px solid rgba(7,193,96,.22);border-radius:6px;padding:32px 28px;margin-bottom:28px;text-align:center}
.wechat-intro{font-size:15px;color:#c8d8c8;line-height:2.1;margin-bottom:24px}
.wechat-box{display:inline-flex;flex-direction:column;align-items:center;background:rgba(7,193,96,.10);border:1px solid rgba(7,193,96,.32);border-radius:8px;padding:20px 52px;margin-bottom:20px;animation:wPulse 2.8s ease infinite}
.wechat-label{font-size:11px;color:rgba(7,193,96,.6);letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;margin-top:10px}
.wechat-id{font-size:26px;font-weight:700;color:var(--wechat);letter-spacing:2px}
.wechat-guide{font-size:12px;color:#5a7a5a;line-height:2.1}
.wechat-guide span{color:var(--wechat)}

.footer{border-top:1px solid var(--bdim);padding-top:26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.footer-brand{font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.footer-sub{font-size:11px;color:#504840}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,.28);border-radius:2px}
</style>
</head>
<body>

<div id="topbar"></div>
<div id="banner">
  <div class="banner-icon" id="b-icon"></div>
  <div class="banner-label" id="b-label"></div>
  <div class="banner-title" id="b-title"></div>
</div>
<div id="app"></div>

<script>
const SECS={
  1:{label:'第一部分',title:'时代觉醒',icon:'◈',bg:'#0e1620',accent:'#5da0e8'},
  2:{label:'第二部分',title:'家庭觉醒',icon:'◉',bg:'#1a1008',accent:'#e8a04a'},
  3:{label:'第三部分',title:'孩子觉醒',icon:'◎',bg:'#081810',accent:'#4ab87a'},
  4:{label:'第四部分',title:'路径觉醒',icon:'◈',bg:'#120e1c',accent:'#a070e8'},
  5:{label:'第五部分',title:'现实觉醒',icon:'◉',bg:'#1c0a08',accent:'#e86050'},
  6:{label:'第六部分',title:'家庭定位',icon:'◎',bg:'#081610',accent:'#80c850'},
};

const AL=['A','B','C','D','E'];

const Qs=[
  {id:1,s:1,q:'如果AI正在替代越来越多知识型工作，你认为孩子未来最需要提前建立什么能力？'},
  {id:2,s:1,q:'你更希望孩子：',opts:['拥有高学历','拥有真实社会竞争力']},
  {id:3,s:1,q:'你是否认真思考过：孩子未来最大的竞争对手，可能不是同龄人，而是AI？'},
  {id:4,s:1,q:'未来最危险的孩子，你认为是：',opts:['成绩差的孩子','没有真实能力的孩子']},
  {id:5,s:1,q:'你更关注孩子：',opts:['今天的成绩','10年后的生存能力']},
  {id:6,s:2,q:'你是否正在用自己过去时代的经验，要求孩子面对未来世界？'},
  {id:7,s:2,q:'如果未来很多职业都会被AI重构，你的家庭是否已经开始提前布局？'},
  {id:8,s:2,q:'除了学校成绩，你的家庭是否重视：',items:['表达能力','AI工具能力','解决问题能力','创造能力','真实项目能力']},
  {id:9,s:3,q:'你的孩子在哪些事情上，最容易进入「忘记时间」的状态？'},
  {id:10,s:3,q:'你是否发现：很多孩子的问题，可能并不是「不够聪明」，而是从小没有真正找到：自己擅长什么、热爱什么、未来适合什么？'},
  {id:11,s:3,q:'你现在培养孩子的方向，更多是基于：',opts:['孩子的真实优势','社会惯性与家长期待']},
  {id:12,s:3,q:'如果不考虑学历、面子与传统路径，你觉得孩子真正适合什么样的人生？'},
  {id:13,s:3,q:'你认为孩子更偏向哪一种类型？',opts:['逻辑研究型','创造表达型','商业社交型','动手实践型','自主探索型']},
  {id:14,s:4,q:'如果孩子未来方向明确，并且已经具备真实能力，你是否还认为「必须先上大学」？'},
  {id:15,s:4,q:'以下哪些孩子，更适合大学路线？',opts:['强逻辑研究型','医学 / 科研 / 法律型','学术深度型','明确需要专业认证行业']},
  {id:16,s:4,q:'以下哪些孩子，可能更适合提前进入真实项目与社会实践？',opts:['创业型','创造表达型','商业社交型','AI工具实践型','动手实战型']},
  {id:17,s:5,
    q:'你是否发现：越来越多企业，已经开始弱化学历要求——',
    companies:{'海外企业':['Google','IBM','Tesla','Apple','Palantir'],'中国企业':['腾讯','华为','吉利','字节跳动']},
    recruit:['都已经开始：','直接招聘高中生、','提前关注年轻潜力人才、','重视真实能力与项目能力。'],
    note:'AI时代，很多企业开始意识到：真正重要的，不只是学历，而是学习能力、创造能力与真实能力。'},
  {id:18,s:5,q:'你怎么看待：越来越多大学生毕业后，从事网约车、外卖、快递等工作，而这些岗位，很多并不需要大学学历？'},
  {id:19,s:5,q:'如果未来几年——无人驾驶、AI客服、AI助手、自动化系统全面成熟，今天很多「普通工作」可能再次被替代。',
    note:'你认为孩子未来真正需要具备什么能力，才能长期站稳脚跟？'},
  {id:20,s:5,q:'你是否发现：越来越多十几岁的年轻人，已经开始——',
    items:['用AI做内容','用AI开发产品','用AI建立个人IP','用AI制作视频','用AI获得第一桶金','用AI创建自己的项目','成立自己的小团队与公司'],
    note:'AI时代，普通年轻人第一次拥有了「接近零成本创造价值」的机会。不依赖背景、关系与大量资金，就有机会提前进入真实世界。'},
  {id:21,s:5,q:'你是否意识到：未来真正危险的，可能不是孩子「不够努力」，而是——孩子花了十几年时间，却只获得了「容易被AI替代的能力」。'},
  {id:22,s:6,q:'你是否认真想过：如果未来几年，AI开始大规模辅助办公、处理文书、数据分析、审批流程、行政管理——当经济压力增加时，包括公务员体系在内，很多过去被认为「稳定」的岗位，是否也可能被重新优化与重构？',
    note:'AI时代，真正长期稳定的，可能不再是某一种职业，而是：持续适应变化与创造价值的能力。'},
  {id:23,s:6,q:'你觉得你的家庭，目前更接近哪一种状态？',
    opts:['传统路径型 — 依然相信「成绩→学历→稳定工作」','转型探索型 — 已经意识到时代变化，但还不知道如何布局','AI觉醒型 — 开始重视AI、真实能力与未来竞争力','提前布局型 — 已经开始帮助孩子建立AI时代长期能力']},
  {id:24,s:6,q:'如果AI时代真正重新洗牌一次，你觉得：你的家庭，是否已经准备好了？'},
];

let phase='intro', idx=0, bannerTimer=null;

function escH(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function showBanner(sec){
  const b=document.getElementById('banner');
  b.style.background=sec.bg;
  document.getElementById('b-icon').textContent=sec.icon;
  document.getElementById('b-icon').style.color=sec.accent;
  document.getElementById('b-label').textContent=sec.label;
  document.getElementById('b-title').textContent=sec.title;
  b.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer=setTimeout(()=>{b.classList.remove('show');},3600);
}

function renderIntro(){
  return `
  <div class="page">
    <div class="logo-row">
      <div class="logo-box">◈</div>
      <div>
        <div class="logo-top">纳维明 NavMind AI</div>
        <div class="logo-bot">父母罗盘™ · AI时代家庭觉醒系统</div>
      </div>
    </div>
    <div class="eyebrow">AI来了，什么样的孩子才有出路？</div>
    <h1>不是测试孩子。<br/><span>而是帮助父母</span><br/>重新看清未来。</h1>
    <div class="rule-row"><div class="rule"></div><div class="rule-text">父母罗盘™ 核心理念</div></div>
    <div class="card">
      <p>我们不认为：所有孩子都必须走同一条路。<br/>也不认为：大学已经没有价值。</p>
      <p class="light">我们真正想帮助父母思考的是：<br/><strong style="color:var(--cream)">什么样的孩子，适合什么样的发展路径？</strong></p>
      <div class="divider"></div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:8px">因为AI时代，真正危险的不是孩子不够努力。</p>
      <div class="danger">而是：方向错了，却还在拼命努力。</div>
    </div>
    <div class="stats">
      <div><div class="stat-num">24</div><div class="stat-lbl">道觉醒问题</div></div>
      <div><div class="stat-num">6</div><div class="stat-lbl">个思考维度</div></div>
      <div><div class="stat-num">15</div><div class="stat-lbl">分钟完成</div></div>
    </div>
    <button class="btn" onclick="goQuiz()">开始思考 →</button>
  </div>`;
}

function renderQuiz(){
  const q=Qs[idx];
  const sec=SECS[q.s];
  const pct=Math.round(((idx+1)/Qs.length)*100);

  let content='';

  // opts
  if(q.opts){
    content+=`<div class="opts">`;
    q.opts.forEach((o,i)=>{
      content+=`<div class="opt-row"><span class="opt-label">${AL[i]}</span><span class="opt-text">${escH(o)}</span></div>`;
    });
    content+=`</div>`;
  }

  // items
  if(q.items){
    content+=`<div class="items-box">`;
    q.items.forEach(item=>{
      content+=`<div class="item-row"><div class="dot"></div><span class="item-text">${escH(item)}</span></div>`;
    });
    content+=`</div>`;
  }

  // companies
  if(q.companies){
    content+=`<div class="companies">`;
    Object.entries(q.companies).forEach(([lbl,list])=>{
      content+=`<div class="company-box"><div class="company-label">${lbl}</div>`;
      list.forEach(c=>{ content+=`<div class="company-name">${c}</div>`; });
      content+=`</div>`;
    });
    content+=`</div>`;
  }

  // recruit
  if(q.recruit){
    content+=`<div class="recruit-box"><div class="recruit-tag">⭐ 最新动向</div>`;
    q.recruit.forEach((line,i)=>{
      if(i===0){content+=`<p class="recruit-intro">${escH(line)}</p>`;}
      else{content+=`<p class="recruit-line">${escH(line)}</p>`;}
    });
    content+=`</div>`;
  }

  // note
  if(q.note){
    content+=`<div class="note-box"><p class="note-text">${escH(q.note)}</p></div>`;
  }

  return `
  <div class="page">
    <div style="margin-bottom:38px">
      <div class="progress-header">
        <div class="progress-section">
          <span class="progress-icon" style="color:${sec.accent}">${sec.icon}</span>
          <span class="progress-label">${sec.label} · ${sec.title}</span>
        </div>
        <span class="progress-count">${idx+1} / ${Qs.length}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,${sec.bg},${sec.accent})"></div>
      </div>
    </div>
    <div class="q-num" style="color:${sec.accent}">第 ${q.id} 题</div>
    <div class="q-text">${escH(q.q)}</div>
    ${content}
    <button class="btn" style="background:${sec.accent};color:var(--ink)" onclick="goNext()">继续思考 →</button>
  </div>`;
}

function renderResult(){
  return `
  <div class="page result">
    <div class="logo-row" style="margin-bottom:44px">
      <div class="logo-box" style="width:28px;height:28px;font-size:12px">◎</div>
      <div>
        <div class="logo-top">父母罗盘™ · 24问完成</div>

function render(){
  const app=document.getElementById('app');
  if(phase==='intro')      { app.innerHTML=renderIntro(); }
  else if(phase==='quiz')  { app.innerHTML=renderQuiz(); }
  else if(phase==='result'){ app.innerHTML=renderResult(); }
  window.scrollTo(0,0);
}

function goQuiz(){
  phase='quiz'; idx=0;
  render();
}

function goNext(){
  const prevS = Qs[idx]?.s;
  const isLast = idx+1 >= Qs.length;
  if(isLast){
    phase='result';
    render();
    return;
  }
  idx++;
  const newS = Qs[idx]?.s;
  if(newS !== prevS){
    showBanner(SECS[newS]);
    setTimeout(()=>render(), 200);
  } else {
    render();
  }
}

function goAgain(){
  phase='intro'; idx=0;
  render();
}

// init
render();
</script>
